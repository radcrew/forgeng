name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # corepack activates the pnpm version pinned in package.json#packageManager.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client must exist before lint/typecheck/tests, otherwise
      # type-aware ESLint sees every model access as `any` and floods errors.
      - name: Generate Prisma client
        run: pnpm --filter @forgeng/backend prisma:generate

      - name: Lint
        run: pnpm --filter @forgeng/backend lint

      - name: Unit tests
        run: pnpm --filter @forgeng/backend test

      # E2E uses a mocked Prisma client, so no database service is required.
      - name: E2E tests
        run: pnpm --filter @forgeng/backend test:e2e

  frontend:
    name: Frontend (lint + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @forgeng/frontend lint

      - name: Unit tests
        run: pnpm --filter @forgeng/frontend test
